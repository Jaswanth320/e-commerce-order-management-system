<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>E-Commerce Order Management System</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Products</a>
            <a href="#">Orders</a>
            <a href="cart.html">Cart</a>
            <a href="#">Login</a>
        </nav>

    </header>


    <main class="checkout-page">

        <h2>Checkout</h2>

        <div class="checkout-container">

            <!-- Customer Details -->

            <div class="customer-details">

                <h3>Customer Details</h3>

                <label>Full Name</label>
                <input type="text" id="customer-name"
                    placeholder="Enter your full name">

                <label>Email</label>
                <input type="email" id="customer-email"
                    placeholder="Enter your email">

                <label>Phone Number</label>
                <input type="tel" id="customer-phone"
                    placeholder="Enter your phone number">

                <label>Delivery Address</label>
                <textarea id="customer-address"
                    placeholder="Enter your delivery address"></textarea>

                <label>Payment Method</label>

                <select id="payment-method">
                    <option value="">Select Payment Method</option>
                    <option value="Cash on Delivery">Cash on Delivery</option>
                    <option value="UPI">UPI</option>
                    <option value="Credit/Debit Card">
                        Credit/Debit Card
                    </option>
                </select>

                <button id="place-order">
                    Place Order
                </button>

            </div>


            <!-- Order Summary -->

            <div class="order-summary">

                <h3>Order Summary</h3>

                <div id="checkout-items"></div>

                <hr>

                <h2>
                    Total: ₹<span id="checkout-total">0</span>
                </h2>

            </div>

        </div>

    </main>


    <footer>

        <p>© 2026 E-Commerce Order Management System</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
